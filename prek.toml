default_install_hook_types = ["pre-commit", "pre-push"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"] },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-json", exclude = '^tsconfig.*\.json$' },
  { id = "check-toml" },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files", args = ["--maxkb=1024"] },
  { id = "detect-private-key" },
  { id = "check-case-conflict" },
  { id = "check-illegal-windows-names" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt check"
language = "system"
entry = "cargo fmt --manifest-path src-tauri/Cargo.toml -- --check"
types = ["rust"]
pass_filenames = false
stages = ["pre-commit", "pre-push"]

[[repos.hooks]]
id = "frontend-build"
name = "frontend build"
language = "system"
entry = "npm run build"
pass_filenames = false
files = '^(src/|index\.html|package(-lock)?\.json|vite\.config\.ts|tsconfig.*\.json)'
stages = ["pre-push"]

[package]
name = "koyo"
version = "0.2.0"
description = "Native database client built with GPUI"
edition = "2024"

[dependencies]
gpui-kit = "0.9.1"
koyo-core = { path = "../koyo-core" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
uuid = "1"
rfd = "0.17"
lsp-types = "0.97"
anyhow = "1"
ropey = "1"

[dev-dependencies]
serde_json = "1"

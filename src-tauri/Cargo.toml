[package]
name = "koyo-db"
version = "0.1.0"
description = "Cross-platform PostgreSQL client"
authors = ["Koyo contributors"]
edition = "2024"

[lib]
name = "koyo_db_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "4", default-features = false, features = ["v1"] }
tokio-postgres = "0.7"
rustls-tokio-postgres = { version = "0.5", features = ["platform-verifier"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["sync", "time"] }
futures-util = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration

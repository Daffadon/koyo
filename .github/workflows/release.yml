name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: koyo-linux-x64.tar.gz
          - name: windows-x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            archive: koyo-windows-x64.zip
          - name: macos-apple-silicon
            platform: macos-15
            target: aarch64-apple-darwin
            archive: koyo-macos-arm64.tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: . -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mold \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libwayland-dev \
            libxcb1-dev

      - name: Check version and tag
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' koyo/Cargo.toml | head -n1)
          CORE_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' koyo-core/Cargo.toml | head -n1)
          if [ "$VERSION" != "$CORE_VERSION" ]; then
            echo "Version mismatch: koyo=$VERSION koyo-core=$CORE_VERSION"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match version v$VERSION"
            exit 1
          fi

      - name: Build release binary
        run: cargo build --release -p koyo --target ${{ matrix.target }}

      - name: Package Unix binary
        if: matrix.platform != 'windows-latest'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf "$GITHUB_WORKSPACE/${{ matrix.archive }}" koyo

      - name: Package Windows binary
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/koyo.exe" -DestinationPath "${{ matrix.archive }}"

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  publish:
    name: Publish draft release
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          prerelease: false
          name: Koyo ${{ github.ref_name }}
          body: |
            Koyo desktop builds for Windows, macOS, and Linux.

            Linux requires libxkbcommon, libxkbcommon-x11, X11, Wayland, and fontconfig runtime libraries.
            These builds are unsigned. On macOS, right-click the app and choose Open. On Windows, SmartScreen may warn.
          files: artifacts/*

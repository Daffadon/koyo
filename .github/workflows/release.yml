name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build ${{ matrix.name }}
    permissions:
      contents: read
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: koyo-linux-x64.tar.gz
          - name: windows-x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            archive: koyo-windows-x64.zip
          - name: macos-apple-silicon
            platform: macos-15
            target: aarch64-apple-darwin
            archive: koyo-macos-arm64.tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: . -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mold \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libwayland-dev \
            libxcb1-dev

      - name: Check version and tag
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' koyo/Cargo.toml | head -n1)
          CORE_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' koyo-core/Cargo.toml | head -n1)
          if [ "$VERSION" != "$CORE_VERSION" ]; then
            echo "Version mismatch: koyo=$VERSION koyo-core=$CORE_VERSION"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match version v$VERSION"
            exit 1
          fi

      - name: Build release binary
        run: cargo build --locked --release -p koyo --target ${{ matrix.target }}

      - name: Package Linux application
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          STAGE="$RUNNER_TEMP/koyo-linux"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/koyo" "$STAGE/koyo"
          cp koyo/assets/koyo.png "$STAGE/koyo.png"
          cp packaging/linux/koyo.desktop packaging/linux/install.sh "$STAGE/"
          chmod +x "$STAGE/koyo" "$STAGE/install.sh"
          tar -czf "$GITHUB_WORKSPACE/${{ matrix.archive }}" -C "$STAGE" \
            koyo koyo.desktop koyo.png install.sh

      - name: Package macOS app
        if: matrix.platform == 'macos-15'
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' koyo/Cargo.toml | head -n1)
          APP="$GITHUB_WORKSPACE/Koyo.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "target/${{ matrix.target }}/release/koyo" "$APP/Contents/MacOS/koyo"
          cp koyo/assets/koyo.icns "$APP/Contents/Resources/koyo.icns"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleDisplayName</key>
            <string>Koyo</string>
            <key>CFBundleExecutable</key>
            <string>koyo</string>
            <key>CFBundleIconFile</key>
            <string>koyo.icns</string>
            <key>CFBundleIdentifier</key>
            <string>com.daffadon.koyo</string>
            <key>CFBundleName</key>
            <string>Koyo</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST
          chmod +x "$APP/Contents/MacOS/koyo"
          tar -czf "$GITHUB_WORKSPACE/${{ matrix.archive }}" -C "$GITHUB_WORKSPACE" Koyo.app

      - name: Package macOS disk image
        if: matrix.platform == 'macos-15'
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist
          cp -R Koyo.app dist/Koyo.app
          ln -s /Applications dist/Applications
          hdiutil create -volname "Koyo" -srcfolder dist -ov -format UDZO \
            "$GITHUB_WORKSPACE/koyo-macos-arm64.dmg"

      - name: Package Windows binary
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/koyo.exe" -DestinationPath "${{ matrix.archive }}"

      - name: Build Windows installer
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          $version = (Select-String -Path koyo/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $makensis) {
            $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          }
          & $makensis "/DVERSION=$version" packaging/windows/koyo.nsi

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

      - name: Upload Windows installer
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: koyo-windows-x64-setup.exe
          path: koyo-windows-x64-setup.exe

      - name: Upload macOS disk image
        if: matrix.platform == 'macos-15'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: koyo-macos-arm64.dmg
          path: koyo-macos-arm64.dmg

  publish:
    name: Publish draft release
    needs: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-path: artifacts/*

      - name: Generate SHA-256 checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS

      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          prerelease: false
          name: Koyo ${{ github.ref_name }}
          body: |
            Koyo desktop builds for Windows, macOS, and Linux.

            Linux requires libxkbcommon, libxkbcommon-x11, X11, Wayland, and fontconfig runtime libraries.
            These builds are unsigned. Verify downloads with SHA256SUMS. Build provenance is attached and can be checked with `gh attestation verify <archive> --repo ${{ github.repository }}`. On macOS, right-click the app and choose Open. On Windows, SmartScreen may warn.
          files: artifacts/*

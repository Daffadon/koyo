name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build ${{ matrix.name }}
    permissions:
      contents: read
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: koyo-linux-x64.tar.gz
          - name: windows-x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            archive: koyo-windows-x64.zip
          - name: macos-apple-silicon
            platform: macos-15
            target: aarch64-apple-darwin
            archive: koyo-macos-arm64.tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: . -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mold \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libwayland-dev \
            libxcb1-dev

      - name: Check version and tag
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' koyo/Cargo.toml | head -n1)
          CORE_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' koyo-core/Cargo.toml | head -n1)
          if [ "$VERSION" != "$CORE_VERSION" ]; then
            echo "Version mismatch: koyo=$VERSION koyo-core=$CORE_VERSION"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match version v$VERSION"
            exit 1
          fi

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Build release binary
        run: cargo build --locked --release -p koyo --target ${{ matrix.target }}

      - name: Package Linux application
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          STAGE="$RUNNER_TEMP/koyo-linux"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/koyo" "$STAGE/koyo"
          cp koyo/assets/koyo.png "$STAGE/koyo.png"
          cp packaging/linux/koyo.desktop packaging/linux/install.sh "$STAGE/"
          chmod +x "$STAGE/koyo" "$STAGE/install.sh"
          tar -czf "$GITHUB_WORKSPACE/${{ matrix.archive }}" -C "$STAGE" \
            koyo koyo.desktop koyo.png install.sh

      - name: Package macOS app
        if: matrix.platform == 'macos-15'
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' koyo/Cargo.toml | head -n1)
          APP="$GITHUB_WORKSPACE/Koyo.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "target/${{ matrix.target }}/release/koyo" "$APP/Contents/MacOS/koyo"
          cp koyo/assets/koyo.icns "$APP/Contents/Resources/koyo.icns"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleDisplayName</key>
            <string>Koyo</string>
            <key>CFBundleExecutable</key>
            <string>koyo</string>
            <key>CFBundleIconFile</key>
            <string>koyo.icns</string>
            <key>CFBundleIdentifier</key>
            <string>com.daffadon.koyo</string>
            <key>CFBundleName</key>
            <string>Koyo</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST
          chmod +x "$APP/Contents/MacOS/koyo"
          tar -czf "$GITHUB_WORKSPACE/${{ matrix.archive }}" -C "$GITHUB_WORKSPACE" Koyo.app

      - name: Package macOS disk image
        if: matrix.platform == 'macos-15'
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist
          cp -R Koyo.app dist/Koyo.app
          ln -s /Applications dist/Applications
          hdiutil create -volname "Koyo" -srcfolder dist -ov -format UDZO \
            "$GITHUB_WORKSPACE/koyo-macos-arm64.dmg"

      - name: Package Windows binary
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/koyo.exe" -DestinationPath "${{ matrix.archive }}"

      - name: Build Windows installer
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $nsisSha256 = "fb603934e8dd7f04d4d3ec757dc7ff990bd8cf372c082619b9c187b120ef4bd9"
          $nsisUrl = "https://www.nuget.org/api/v2/package/NSIS-Package/3.11.0.2"
          $nsisRoot = Join-Path $env:RUNNER_TEMP "nsis-package"
          $nsisZip = Join-Path $env:RUNNER_TEMP "nsis-package.zip"
          $makensis = $null

          try {
            curl.exe --fail --location --retry 5 --retry-delay 5 --output $nsisZip $nsisUrl
            if ($LASTEXITCODE -ne 0) { throw "curl failed with exit code $LASTEXITCODE" }
            $actualHash = (Get-FileHash -LiteralPath $nsisZip -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $nsisSha256) {
              throw "checksum mismatch: expected $nsisSha256, got $actualHash"
            }
            New-Item -ItemType Directory -Path $nsisRoot -Force | Out-Null
            Expand-Archive -LiteralPath $nsisZip -DestinationPath $nsisRoot -Force
            $candidate = Join-Path $nsisRoot "NSIS\makensis.exe"
            if (Test-Path -LiteralPath $candidate -PathType Leaf) {
              $makensis = $candidate
            } else {
              throw "makensis.exe missing after extraction"
            }
          } catch {
            Write-Warning "Pinned NSIS download failed: $_"
          }

          if (-not $makensis -and (Get-Command winget -ErrorAction SilentlyContinue)) {
            Write-Host "Trying winget for NSIS"
            winget install --id NSIS.NSIS --exact --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
            $makensis = @(
              "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
              "$env:ProgramFiles\NSIS\makensis.exe"
            ) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          }

          if (-not $makensis) {
            Write-Host "Trying Chocolatey for NSIS"
            choco install nsis --no-progress -y
            $makensis = @(
              "${env:ProgramFiles(x86)}\NSIS\makensis.exe",
              "$env:ProgramFiles\NSIS\makensis.exe"
            ) | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          }

          if (-not $makensis) {
            throw "NSIS makensis.exe is unavailable"
          }

          $version = (Select-String -Path koyo/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $root = (Get-Location).Path
          $icon = Join-Path $root "koyo\assets\koyo.ico"
          $exe = Join-Path $root "target\${{ matrix.target }}\release\koyo.exe"
          $out = Join-Path $root "koyo-windows-x64-setup.exe"
          foreach ($path in @($icon, $exe)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing NSIS input: $path"
            }
          }
          & $makensis "/DVERSION=$version" "/DICON=$icon" "/DEXE=$exe" "/DOUTFILE=$out" packaging/windows/koyo.nsi
          if ($LASTEXITCODE -ne 0) {
            throw "makensis failed with exit code $LASTEXITCODE"
          }

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

      - name: Upload Windows installer
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: koyo-windows-x64-setup.exe
          path: koyo-windows-x64-setup.exe

      - name: Upload macOS disk image
        if: matrix.platform == 'macos-15'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: koyo-macos-arm64.dmg
          path: koyo-macos-arm64.dmg

  publish:
    name: Publish draft release
    needs: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          PREVIOUS=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$PREVIOUS" ]; then
            RANGE="$PREVIOUS..$GITHUB_REF_NAME"
            TITLE="Changes since $PREVIOUS"
          else
            RANGE="$GITHUB_REF_NAME"
            TITLE="Changes"
          fi
          CHANGES=$(git log --no-merges --invert-grep \
            --grep='^chore(release): bump version' \
            --pretty=format:'- %s (`%h`) — %an' "$RANGE")
          CONTRIBUTORS=$(git log --no-merges --invert-grep \
            --grep='^chore(release): bump version' \
            --pretty=format:'%an' "$RANGE" | sort -fu)
          {
            echo "## $TITLE"
            echo
            if [ -n "$CHANGES" ]; then echo "$CHANGES"; else echo "- No changes."; fi
            echo
            echo
            echo "## Contributors"
            echo
            if [ -n "$CONTRIBUTORS" ]; then echo "$CONTRIBUTORS" | sed 's/^/- /'; else echo "- None."; fi
            echo
            echo
            echo "## Installation"
            echo
            echo "Koyo desktop builds for Windows, macOS, and Linux."
            echo
            echo "Linux requires libxkbcommon, libxkbcommon-x11, X11, Wayland, and fontconfig runtime libraries."
            echo "These builds are unsigned. Verify downloads with SHA256SUMS. Build provenance is attached and can be checked with `gh attestation verify <archive> --repo $GITHUB_REPOSITORY`. On macOS, right-click the app and choose Open. On Windows, SmartScreen may warn."
          } > release-notes.md

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-path: artifacts/*

      - name: Generate SHA-256 checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS

      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          prerelease: false
          name: Koyo ${{ github.ref_name }}
          body_path: release-notes.md
          files: artifacts/*

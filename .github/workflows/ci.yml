name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: koyo
          POSTGRES_DB: koyo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d koyo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: koyo
          MYSQL_DATABASE: koyo
        ports:
          - 13307:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pkoyo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: . -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libwayland-dev \
            libxcb1-dev

      - name: Seed MySQL fixtures
        run: |
          docker exec "${{ job.services.mysql.id }}" \
            mysql -uroot -pkoyo koyo < .github/mysql-init.sql

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Run live PostgreSQL and MySQL tests
        env:
          KOYO_TEST_DATABASE_URL: postgresql://postgres:koyo@127.0.0.1:5432/koyo
          KOYO_TEST_DB_HOST: 127.0.0.1
          KOYO_TEST_MYSQL_PORT: 13307
        run: |
          cargo test -p koyo-core --locked -- \
            --ignored \
            --skip mssql_workflow \
            --skip mssql_cancel_running_query \
            --skip oracle_workflow
